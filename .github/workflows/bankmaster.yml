name: BANKMASTER build, test & validate

on:
  push:
    paths:
      - "BANKMASTER/**"
      - ".github/workflows/bankmaster.yml"
  pull_request:
    paths:
      - "BANKMASTER/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # download the released V1 artifacts (run #8) for the V1 x V2 comparison

env:
  PLUGINVAL_VERSION: v1.0.4
  V1_RUN_ID: "39829983406"   # run #8: BANKMASTER 1.0.0 installers
  VST3SDK_TAG: v3.7.12_build_20
  VST3SDK_OPTS: -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_RUN_VST_VALIDATOR=OFF

jobs:
  macos-universal:
    name: macOS universal (arm64 + x86_64) - VST3 / AU / Standalone + installer
    runs-on: macos-latest
    defaults:
      run:
        shell: bash   # bash -eo pipefail: a failing test can never hide behind "| tee"
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal)
        run: cmake -S BANKMASTER -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: Architectures (lipo)
        run: |
          ART=build/BankMaster_artefacts/Release
          lipo -info "$ART/VST3/BANKMASTER.vst3/Contents/MacOS/BANKMASTER" | tee lipo.txt
          lipo -info "$ART/AU/BANKMASTER.component/Contents/MacOS/BANKMASTER" | tee -a lipo.txt
          lipo -info "$ART/Standalone/BANKMASTER.app/Contents/MacOS/BANKMASTER" | tee -a lipo.txt
          lipo -info build/bankmaster_dsp_tests | tee -a lipo.txt
          grep -c "x86_64 arm64\|arm64 x86_64" lipo.txt

      - name: DSP tests (arm64, native)
        run: ./build/bankmaster_dsp_tests | tee dsp_tests_macos_arm64.txt

      - name: DSP tests (x86_64 slice under Rosetta 2)
        run: |
          softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          arch -x86_64 ./build/bankmaster_dsp_tests | tee dsp_tests_macos_x86_64.txt

      - name: Plugin tests (state, presets, A/B, undo, automation, V2 UI bindings, sizes, Retina snapshots)
        run: |
          mkdir -p snapshots
          ./build/bankmaster_plugin_tests_artefacts/Release/bankmaster_plugin_tests --snapshot snapshots | tee plugin_tests_macos.txt
          grep -q " 0 failures" plugin_tests_macos.txt

      - name: Identity (vendor "Kalox Audio", unchanged plug-in IDs, app icon)
        run: |
          ART=build/BankMaster_artefacts/Release
          HC=build/bankmaster_hostcheck_artefacts/Release/bankmaster_hostcheck
          R=identity_macos.txt
          grep -E '"(Name|Vendor|Version|CID)"' $ART/VST3/BANKMASTER.vst3/Contents/Resources/moduleinfo.json | tee $R
          grep -q '"Vendor": "Kalox Audio"' $ART/VST3/BANKMASTER.vst3/Contents/Resources/moduleinfo.json
          grep -q '"CID": "ABCDEF019182FAEB4B6C6F78426B6D73"' $ART/VST3/BANKMASTER.vst3/Contents/Resources/moduleinfo.json   # same class ID as 1.0
          PB=/usr/libexec/PlistBuddy
          for k in name manufacturer subtype type version; do echo "AU $k: $($PB -c "Print :AudioComponents:0:$k" $ART/AU/BANKMASTER.component/Contents/Info.plist)"; done | tee -a $R
          test "$($PB -c 'Print :AudioComponents:0:name' $ART/AU/BANKMASTER.component/Contents/Info.plist)" = "Kalox Audio: BANKMASTER"
          test "$($PB -c 'Print :AudioComponents:0:manufacturer' $ART/AU/BANKMASTER.component/Contents/Info.plist)" = "Klox"
          test "$($PB -c 'Print :AudioComponents:0:subtype' $ART/AU/BANKMASTER.component/Contents/Info.plist)" = "Bkms"
          for b in VST3/BANKMASTER.vst3 AU/BANKMASTER.component Standalone/BANKMASTER.app; do echo "$b bundle id: $($PB -c 'Print :CFBundleIdentifier' $ART/$b/Contents/Info.plist)"; done | tee -a $R
          test -f $ART/Standalone/BANKMASTER.app/Contents/Resources/Icon.icns
          echo "Standalone icon: $($PB -c 'Print :CFBundleIconFile' $ART/Standalone/BANKMASTER.app/Contents/Info.plist) ($(stat -f%z $ART/Standalone/BANKMASTER.app/Contents/Resources/Icon.icns) bytes)" | tee -a $R
          sips -s format png $ART/Standalone/BANKMASTER.app/Contents/Resources/Icon.icns --out snapshots/standalone_app_icon_macos.png >/dev/null
          $HC describe $ART/VST3/BANKMASTER.vst3 | tee -a $R
          grep -q "manufacturer=Kalox Audio" $R

      - name: Audio Unit validation (auval, arm64 + x86_64)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/BankMaster_artefacts/Release/AU/BANKMASTER.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i kalox | tee auval_list.txt || true
          grep -q "Kalox Audio: BANKMASTER" auval_list.txt
          auval -strict -v aufx Bkms Klox | tee auval_arm64.txt
          arch -x86_64 auval -strict -v aufx Bkms Klox | tee auval_x86_64.txt
          grep -q "AU VALIDATION SUCCEEDED" auval_arm64.txt
          grep -q "AU VALIDATION SUCCEEDED" auval_x86_64.txt

      - name: pluginval (VST3 + AU, strictness 10)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3 | tee pluginval_macos_vst3.txt
          $PV --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate ~/Library/Audio/Plug-Ins/Components/BANKMASTER.component | tee pluginval_macos_au.txt

      - name: Steinberg VST3 validator (official SDK, arm64 + x86_64)
        run: |
          git clone -q --depth 1 --branch "$VST3SDK_TAG" --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" $VST3SDK_OPTS
          cmake --build vst3build --config Release --target validator -j 3
          V=$(find vst3build -type f -name validator -perm -u+x | head -1)
          lipo -info "$V"
          "$V" build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3 | tee steinberg_validator_macos_arm64.txt
          arch -x86_64 "$V" build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3 | tee steinberg_validator_macos_x86_64.txt
          grep -q " 0 tests failed" steinberg_validator_macos_arm64.txt
          grep -q " 0 tests failed" steinberg_validator_macos_x86_64.txt

      - name: Build installer (.pkg)
        run: |
          BANKMASTER/installer/macos/build_pkg.sh "$PWD/build/BankMaster_artefacts/Release"
          ls -la BANKMASTER/dist
          # inspect the product: component packages and payloads
          pkgutil --expand BANKMASTER/dist/*.pkg pkg-expanded
          ls pkg-expanded | tee pkg_contents.txt
          for c in pkg-expanded/*.pkg; do echo "== $c"; tar -tzf "$c/Payload" 2>/dev/null | grep -E "MacOS/BANKMASTER$|Info.plist$" ; done | tee -a pkg_contents.txt
          grep -q "BANKMASTER.vst3/Contents/MacOS/BANKMASTER" pkg_contents.txt
          grep -q "BANKMASTER.component/Contents/MacOS/BANKMASTER" pkg_contents.txt

      - name: Build DMG (dmgbuild, branded layout)
        run: |
          python3 -m venv dmgenv
          dmgenv/bin/pip install -q dmgbuild
          PATH="$PWD/dmgenv/bin:$PATH" BANKMASTER/installer/macos/dmg/build_dmg.sh "$PWD/BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-macOS-universal.pkg"
          ls -la BANKMASTER/dist

      - name: Verify DMG + real install / uninstall test
        run: |
          DMG=BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-macOS-Universal.dmg
          PKG=BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-macOS-universal.pkg
          R=dmg_test_report.txt
          echo "== hdiutil verify" | tee $R
          hdiutil verify "$DMG" 2>&1 | tee -a $R
          hdiutil imageinfo "$DMG" | grep -E "^Format:|Format Description|Checksum Type|Checksum Value" | tee -a $R
          ls -l "$DMG" | tee -a $R
          MNT="$(mktemp -d)/BANKMASTER"
          mkdir -p "$MNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" | tee -a $R
          echo "== DMG contents" | tee -a $R
          ls -la "$MNT" | tee -a $R
          # dmgbuild layout: Finder settings, volume icon and Retina background at the volume root
          test -f "$MNT/.DS_Store"
          test -f "$MNT/.VolumeIcon.icns"
          test -f "$MNT/.background.tiff"
          test -x "$MNT/Uninstall BANKMASTER.command"
          test -f "$MNT/Read Me - Leia-me.txt"
          echo "layout files present: .DS_Store .VolumeIcon.icns .background.tiff; uninstaller is executable" | tee -a $R
          cmp "$MNT/Install BANKMASTER.pkg" "$PKG"
          echo "pkg inside the DMG is byte-identical to the validated pkg ($(shasum -a 256 "$PKG" | cut -c1-16)...)" | tee -a $R
          echo "== signatures" | tee -a $R
          (pkgutil --check-signature "$MNT/Install BANKMASTER.pkg" || true) 2>&1 | tee -a $R
          (codesign -dv "$DMG" || true) 2>&1 | tee -a $R

          rm -rf ~/Library/Audio/Plug-Ins/Components/BANKMASTER.component   # copy used by the auval step
          # standard shared plug-in folders may be created by the installer when missing and are
          # intentionally never deleted by the uninstaller -> excluded from the comparison
          snap() { find /Library/Audio/Plug-Ins /Applications ~/Library/Audio/Plug-Ins -maxdepth 2 2>/dev/null \
                     | grep -v -x -e /Library/Audio/Plug-Ins/VST3 -e /Library/Audio/Plug-Ins/Components | sort; }
          snap > before.txt
          echo "== install (sudo installer, default choices = VST3 + AU + Standalone)" | tee -a $R
          sudo installer -pkg "$MNT/Install BANKMASTER.pkg" -target / 2>&1 | tee -a $R
          snap > after_install.txt
          (diff before.txt after_install.txt || true) | tee install_diff.txt | tee -a $R
          if grep '^>' install_diff.txt | grep -v 'BANKMASTER'; then echo "unexpected files installed"; exit 1; fi
          grep -q '^> /Library/Audio/Plug-Ins/VST3/BANKMASTER.vst3$' install_diff.txt
          grep -q '^> /Library/Audio/Plug-Ins/Components/BANKMASTER.component$' install_diff.txt
          grep -q '^> /Applications/BANKMASTER.app$' install_diff.txt
          if grep '^<' install_diff.txt; then echo "installer removed something"; exit 1; fi
          lipo -info /Library/Audio/Plug-Ins/VST3/BANKMASTER.vst3/Contents/MacOS/BANKMASTER | tee -a $R
          lipo -info /Library/Audio/Plug-Ins/Components/BANKMASTER.component/Contents/MacOS/BANKMASTER | tee -a $R
          lipo -info /Applications/BANKMASTER.app/Contents/MacOS/BANKMASTER | tee -a $R
          pkgutil --pkgs | grep com.kalox.bankmaster | tee -a $R
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          echo "== auval on the INSTALLED component (arm64 + x86_64)" | tee -a $R
          auval -strict -v aufx Bkms Klox > auval_installed_arm64.txt
          arch -x86_64 auval -strict -v aufx Bkms Klox > auval_installed_x86_64.txt
          grep "AU VALIDATION SUCCEEDED" auval_installed_arm64.txt | tee -a $R
          grep "AU VALIDATION SUCCEEDED" auval_installed_x86_64.txt | tee -a $R
          echo "== Steinberg validator on the INSTALLED VST3" | tee -a $R
          V=$(find vst3build -type f -name validator -perm -u+x | head -1)
          "$V" /Library/Audio/Plug-Ins/VST3/BANKMASTER.vst3 > steinberg_installed.txt
          grep "Result:" steinberg_installed.txt | tee -a $R
          grep -q " 0 tests failed" steinberg_installed.txt

          echo "== uninstall with the DMG's uninstaller" | tee -a $R
          "$MNT/Uninstall BANKMASTER.command" --yes 2>&1 | tee -a $R
          snap > after_uninstall.txt
          diff before.txt after_uninstall.txt
          echo "file system identical to the state before installation" | tee -a $R
          test "$(pkgutil --pkgs | grep -c com.kalox.bankmaster || true)" = "0"
          echo "installer receipts removed" | tee -a $R
          hdiutil detach "$MNT"

      - name: Download the released 1.0.0 DMG (run #8)
        uses: actions/download-artifact@v4
        with:
          name: BANKMASTER-by-KALOX-1.0.0-macOS-Universal-DMG
          path: v1dmg
          run-id: ${{ env.V1_RUN_ID }}
          github-token: ${{ github.token }}

      - name: V1 x V2 audio null test (VST3 + AU, arm64 + x86_64) and real upgrade 1.0 -> 2.0
        run: |
          HC=$PWD/build/bankmaster_hostcheck_artefacts/Release/bankmaster_hostcheck
          R=upgrade_and_null_test_macos.txt
          VST=/Library/Audio/Plug-Ins/VST3/BANKMASTER.vst3
          AU=/Library/Audio/Plug-Ins/Components/BANKMASTER.component
          PB=/usr/libexec/PlistBuddy
          rm -rf ~/Library/Audio/Plug-Ins/Components/BANKMASTER.component
          V1DMG=$(ls v1dmg/*.dmg | head -1)
          shasum -a 256 "$V1DMG" | tee $R
          M1="$(mktemp -d)/v1"; mkdir -p "$M1"
          hdiutil attach "$V1DMG" -nobrowse -readonly -mountpoint "$M1" >/dev/null
          echo "== install the released 1.0.0" | tee -a $R
          sudo installer -pkg "$M1/Install BANKMASTER.pkg" -target / 2>&1 | tee -a $R
          killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 3
          echo "1.0 VST3 version: $($PB -c 'Print :CFBundleShortVersionString' $VST/Contents/Info.plist)" | tee -a $R
          "$HC" describe $VST | tee v1_vst3_description.txt | tee -a $R
          "$HC" describe $AU | tee v1_au_description.txt | tee -a $R
          "$HC" render $VST nt_v1_vst3_arm64
          "$HC" render $AU nt_v1_au_arm64
          arch -x86_64 "$HC" render $VST nt_v1_vst3_x86_64
          arch -x86_64 "$HC" render $AU nt_v1_au_x86_64

          echo "== upgrade: install 2.0.0 over 1.0.0" | tee -a $R
          M2="$(mktemp -d)/v2"; mkdir -p "$M2"
          hdiutil attach BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-macOS-Universal.dmg -nobrowse -readonly -mountpoint "$M2" >/dev/null
          sudo installer -pkg "$M2/Install BANKMASTER.pkg" -target / 2>&1 | tee -a $R
          killall -9 AudioComponentRegistrar 2>/dev/null || true; sleep 3
          for b in $VST $AU /Applications/BANKMASTER.app; do echo "$b -> $($PB -c 'Print :CFBundleShortVersionString' $b/Contents/Info.plist)"; done | tee -a $R
          test "$($PB -c 'Print :CFBundleShortVersionString' $VST/Contents/Info.plist)" = "2.0.0"
          test "$($PB -c 'Print :CFBundleShortVersionString' $AU/Contents/Info.plist)" = "2.0.0"
          test "$($PB -c 'Print :CFBundleShortVersionString' /Applications/BANKMASTER.app/Contents/Info.plist)" = "2.0.0"
          pkgutil --pkg-info com.kalox.bankmaster.vst3 | tee -a $R
          "$HC" describe $VST | tee v2_vst3_description.txt | tee -a $R
          "$HC" describe $AU | tee v2_au_description.txt | tee -a $R
          grep -q "manufacturer=Kalox Audio" v2_vst3_description.txt
          grep -q "manufacturer=Kalox Audio" v2_au_description.txt
          # same plug-in identity before and after (what projects store)
          for f in vst3 au; do
            diff <(grep -E "^(name|uniqueId|deprecatedUid|format)=" v1_${f}_description.txt) <(grep -E "^(name|uniqueId|deprecatedUid|format)=" v2_${f}_description.txt)
            echo "$f: name / uniqueId / deprecatedUid unchanged 1.0 -> 2.0" | tee -a $R
          done
          auval -strict -v aufx Bkms Klox > auval_after_upgrade.txt
          grep "AU VALIDATION SUCCEEDED" auval_after_upgrade.txt | tee -a $R

          "$HC" render $VST nt_v2_vst3_arm64 --state-from nt_v1_vst3_arm64
          "$HC" render $AU nt_v2_au_arm64 --state-from nt_v1_au_arm64
          arch -x86_64 "$HC" render $VST nt_v2_vst3_x86_64 --state-from nt_v1_vst3_x86_64
          arch -x86_64 "$HC" render $AU nt_v2_au_x86_64 --state-from nt_v1_au_x86_64
          ok=0
          for c in vst3_arm64 au_arm64 vst3_x86_64 au_x86_64; do
            echo "== V1 x V2 null test: $c" | tee -a $R
            "$HC" compare nt_v1_$c nt_v2_$c | tee null_test_$c.txt | tee -a $R || ok=1
          done

          echo "== uninstall 2.0.0 (DMG uninstaller)" | tee -a $R
          "$M2/Uninstall BANKMASTER.command" --yes 2>&1 | tee -a $R
          test ! -e $VST && test ! -e $AU && test ! -e /Applications/BANKMASTER.app
          test "$(pkgutil --pkgs | grep -c com.kalox.bankmaster || true)" = "0"
          echo "system clean after uninstall" | tee -a $R
          hdiutil detach "$M1"; hdiutil detach "$M2"
          exit $ok

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: BANKMASTER-BY-KALOX-2.0.0-macOS-Universal-DMG
          path: |
            BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-macOS-Universal.dmg
            BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-macOS-Universal.dmg.sha256

      - name: Package bundles
        run: |
          cd build/BankMaster_artefacts/Release
          ditto -c -k --keepParent VST3/BANKMASTER.vst3 "$GITHUB_WORKSPACE/BANKMASTER-VST3-macOS-universal.zip"
          ditto -c -k --keepParent AU/BANKMASTER.component "$GITHUB_WORKSPACE/BANKMASTER-AU-macOS-universal.zip"
          ditto -c -k --keepParent Standalone/BANKMASTER.app "$GITHUB_WORKSPACE/BANKMASTER-Standalone-macOS-universal.zip"

      - name: Upload installer + bundles
        uses: actions/upload-artifact@v4
        with:
          name: BANKMASTER-macOS-universal
          path: |
            BANKMASTER/dist/*.pkg
            BANKMASTER-*-macOS-universal.zip

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BANKMASTER-macOS-validation-logs
          path: |
            *.txt
            snapshots/*.png
            install_diff.txt
            nt_*/*.txt

  linux:
    name: Linux x86_64 - VST3 / Standalone
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash   # bash -eo pipefail
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb \
            libgtkmm-3.0-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-x11-dev
      - name: Configure & build
        run: |
          cmake -S BANKMASTER -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: DSP tests
        run: ./build/bankmaster_dsp_tests | tee dsp_tests_linux.txt
      - name: Plugin tests
        run: |
          xvfb-run -a ./build/bankmaster_plugin_tests_artefacts/Release/bankmaster_plugin_tests | tee plugin_tests_linux.txt
          grep -q " 0 failures" plugin_tests_linux.txt
      - name: pluginval (VST3, strictness 10)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3 | tee pluginval_linux.txt
      - name: Steinberg VST3 validator (official SDK)
        run: |
          git clone -q --depth 1 --branch "$VST3SDK_TAG" --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3build -G Ninja -DCMAKE_BUILD_TYPE=Release $VST3SDK_OPTS
          cmake --build vst3build --target validator -j 4
          xvfb-run -a vst3build/bin/Release/validator build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3 | tee steinberg_validator_linux.txt
          grep -q " 0 tests failed" steinberg_validator_linux.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BANKMASTER-linux
          path: |
            *.txt
            build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3

  windows:
    name: Windows x64 - VST3 / Standalone + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S BANKMASTER -B build -A x64
          cmake --build build --config Release -j 4
      - name: DSP tests
        run: .\build\Release\bankmaster_dsp_tests.exe
      - name: Plugin tests (state, presets, A/B, undo, automation, V2 UI bindings, sizes, snapshots)
        shell: bash
        run: |
          mkdir -p snapshots
          ./build/bankmaster_plugin_tests_artefacts/Release/bankmaster_plugin_tests.exe --snapshot snapshots | tee plugin_tests_windows.txt
          grep -q " 0 failures" plugin_tests_windows.txt
      - name: Identity (vendor "Kalox Audio", unchanged plug-in IDs, exe icon)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mi = Get-Content build\BankMaster_artefacts\Release\VST3\BANKMASTER.vst3\Contents\Resources\moduleinfo.json -Raw
          $mi | Select-String '"(Vendor|CID|Version)"' -AllMatches | ForEach-Object { $_.Matches.Value } | Out-Null
          ($mi -split "`n" | Select-String '"(Name|Vendor|Version|CID)"') | Out-String | Tee-Object -FilePath identity_windows.txt
          if ($mi -notmatch '"Vendor": "Kalox Audio"') { "vendor is not Kalox Audio"; exit 1 }
          if ($mi -notmatch 'ABCDEF019182FAEB4B6C6F78426B6D73') { "VST3 class ID changed"; exit 1 }
          & .\build\bankmaster_hostcheck_artefacts\Release\bankmaster_hostcheck.exe describe build\BankMaster_artefacts\Release\VST3\BANKMASTER.vst3 | Tee-Object -FilePath identity_windows.txt -Append
          if (-not (Select-String -Path identity_windows.txt -Pattern "manufacturer=Kalox Audio" -Quiet)) { exit 1 }
          Add-Type -AssemblyName System.Drawing
          $exe = "build\BankMaster_artefacts\Release\Standalone\BANKMASTER.exe"
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe))
          $ico.ToBitmap().Save("$pwd\snapshots\standalone_exe_icon_windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          "Standalone exe icon extracted: $($ico.Width)x$($ico.Height)" | Tee-Object -FilePath identity_windows.txt -Append
          (Get-Item $exe).VersionInfo | Format-List CompanyName,ProductName,ProductVersion,FileDescription | Out-String | Tee-Object -FilePath identity_windows.txt -Append
      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3
      - name: Steinberg VST3 validator (official SDK)
        shell: bash
        run: |
          git clone -q --depth 1 --branch "$VST3SDK_TAG" --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          cmake -S vst3sdk -B vst3build -A x64 $VST3SDK_OPTS
          cmake --build vst3build --config Release --target validator -j 4
          ./vst3build/bin/Release/validator.exe build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3 | tee steinberg_validator_windows.txt
          ls -la build/BankMaster_artefacts/Release/Standalone
          grep -q " 0 tests failed" steinberg_validator_windows.txt
      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe).Source }
          & $iscc "/DArtefacts=$pwd\build\BankMaster_artefacts\Release" "/DOutDir=$pwd\BANKMASTER\dist" BANKMASTER\installer\windows\BANKMASTER.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify installer + real install / uninstall test
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          function RunSetup ($file, [string[]] $argList, $log) {
            # bounded wait: a hung (e.g. dialog-blocked) installer fails the step with its log instead of hanging the job
            $proc = Start-Process $file -ArgumentList $argList -PassThru
            if (-not $proc.WaitForExit(300000)) {
              "TIMEOUT after 5 min: $file $argList"
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 120 }
              Get-Process | Where-Object { $_.ProcessName -match 'unins|setup|\.tmp|BANKMASTER' } | Format-Table ProcessName, Id, MainWindowTitle -AutoSize | Out-String
              Stop-Process $proc -Force -ErrorAction SilentlyContinue
              exit 1
            }
            return $proc.ExitCode
          }
          $R = "win_installer_report.txt"
          $exe = Get-Item "BANKMASTER\dist\BANKMASTER-BY-KALOX-2.0.0-Windows-x64-Setup.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          "Installer: $($exe.Name)  size $($exe.Length) bytes  sha256 $hash" | Tee-Object -FilePath $R
          "Authenticode: $((Get-AuthenticodeSignature $exe.FullName).Status)" | Tee-Object -FilePath $R -Append
          $exe.VersionInfo | Format-List ProductName,ProductVersion,CompanyName,FileDescription | Out-String | Tee-Object -FilePath $R -Append

          $vst = Join-Path $env:CommonProgramFiles "VST3"
          $app = Join-Path $env:ProgramFiles "Kalox Audio\BANKMASTER"
          function Snap { @("<snapshot>") + @(Get-ChildItem $vst, (Join-Path $env:ProgramFiles "KALOX"), (Join-Path $env:ProgramFiles "Kalox Audio") -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object FullName | Sort-Object) }
          $before = Snap
          "== silent install (components vst3,standalone)" | Tee-Object -FilePath $R -Append
          $code = RunSetup $exe.FullName @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/COMPONENTS=vst3,standalone',"/LOG=$pwd\install.log") "$pwd\install.log"
          "setup exit code: $code" | Tee-Object -FilePath $R -Append
          if ($code -ne 0) { exit 1 }
          $after = Snap
          $added = @(Compare-Object $before $after | Where-Object SideIndicator -eq '=>' | ForEach-Object InputObject)
          "files added:" | Tee-Object -FilePath $R -Append
          $added | Tee-Object -FilePath $R -Append
          $unexpected = @($added | Where-Object { $_ -notlike "$vst\BANKMASTER.vst3*" -and $_ -notlike "$app*" -and $_ -ne (Join-Path $env:ProgramFiles "Kalox Audio") })
          if ($unexpected.Count -gt 0) { "unexpected files: $unexpected"; exit 1 }
          if (-not (Test-Path "$vst\BANKMASTER.vst3\Contents\x86_64-win\BANKMASTER.vst3")) { "VST3 missing"; exit 1 }
          if (-not (Test-Path "$app\BANKMASTER.exe")) { "Standalone missing"; exit 1 }
          if (-not (Test-Path "$app\unins000.exe")) { "uninstaller missing"; exit 1 }
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{951C821C-D559-4BEF-BC26-6822C33BB554}_is1"
          Get-ItemProperty $key | Format-List DisplayName,DisplayVersion,Publisher,InstallLocation,UninstallString,DisplayIcon | Out-String | Tee-Object -FilePath $R -Append
          if ((Get-ItemProperty $key).Publisher -ne "Kalox Audio") { "publisher is not Kalox Audio"; exit 1 }
          Get-ItemProperty "HKLM:\SOFTWARE\Kalox Audio\BANKMASTER" | Format-List Version,InstallDir,VST3Path | Out-String | Tee-Object -FilePath $R -Append

          "== Steinberg validator on the INSTALLED VST3" | Tee-Object -FilePath $R -Append
          $val = & .\vst3build\bin\Release\validator.exe "$vst\BANKMASTER.vst3" 2>&1 | Out-String
          $val | Out-File steinberg_installed_windows.txt
          ($val -split "`n" | Select-String "Result:") | Out-String | Tee-Object -FilePath $R -Append
          if ($val -notmatch " 0 tests failed") { exit 1 }

          "== silent uninstall" | Tee-Object -FilePath $R -Append
          $ucode = RunSetup "$app\unins000.exe" @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$pwd\uninstall.log") "$pwd\uninstall.log"
          "uninstaller exit code: $ucode" | Tee-Object -FilePath $R -Append
          for ($i = 0; $i -lt 60 -and ((Test-Path "$vst\BANKMASTER.vst3") -or (Test-Path $app)); $i++) { Start-Sleep 1 }
          $final = Snap
          $diff = @(Compare-Object $before $final)
          if ($diff.Count -gt 0) { "file system differs after uninstall:"; $diff; exit 1 }
          "file system identical to the state before installation" | Tee-Object -FilePath $R -Append
          if (Test-Path $key) { "uninstall registry key still present"; exit 1 }
          if (Test-Path "HKLM:\SOFTWARE\Kalox Audio\BANKMASTER") { "Kalox Audio\BANKMASTER registry key still present"; exit 1 }
          "registry entries removed" | Tee-Object -FilePath $R -Append

      - name: Download the released 1.0.0 Setup.exe (run #8)
        uses: actions/download-artifact@v4
        with:
          name: BANKMASTER-by-KALOX-1.0.0-Windows-x64-Setup
          path: v1setup
          run-id: ${{ env.V1_RUN_ID }}
          github-token: ${{ github.token }}

      - name: V1 x V2 audio null test (VST3) and real upgrade 1.0 -> 2.0
        timeout-minutes: 20
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function RunSetup ($file, [string[]] $argList, $log) {
            # bounded wait: a hung (e.g. dialog-blocked) installer fails the step with its log instead of hanging the job
            $proc = Start-Process $file -ArgumentList $argList -PassThru
            if (-not $proc.WaitForExit(300000)) {
              "TIMEOUT after 5 min: $file $argList"
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 120 }
              Get-Process | Where-Object { $_.ProcessName -match 'unins|setup|\.tmp|BANKMASTER' } | Format-Table ProcessName, Id, MainWindowTitle -AutoSize | Out-String
              Stop-Process $proc -Force -ErrorAction SilentlyContinue
              exit 1
            }
            return $proc.ExitCode
          }
          $R = "upgrade_and_null_test_windows.txt"
          $HC = ".\build\bankmaster_hostcheck_artefacts\Release\bankmaster_hostcheck.exe"
          $vst = Join-Path $env:CommonProgramFiles "VST3\BANKMASTER.vst3"
          $v1 = Get-ChildItem v1setup\*.exe | Select-Object -First 1
          "1.0 installer: $($v1.Name) sha256 $((Get-FileHash $v1.FullName).Hash.ToLower())" | Tee-Object -FilePath $R
          $code = RunSetup $v1.FullName @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/COMPONENTS=vst3,standalone',"/LOG=$pwd\install_v1.log") "$pwd\install_v1.log"
          "1.0 setup exit code: $code" | Tee-Object -FilePath $R -Append
          if ($code -ne 0) { exit 1 }
          if (-not (Test-Path (Join-Path $env:ProgramFiles "KALOX\BANKMASTER\BANKMASTER.exe"))) { "1.0 standalone missing"; exit 1 }
          & $HC describe $vst | Tee-Object -FilePath v1_vst3_description.txt | Tee-Object -FilePath $R -Append
          & $HC render $vst nt_v1_vst3_x64 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

          "== upgrade: 2.0.0 over 1.0.0" | Tee-Object -FilePath $R -Append
          $v2 = Get-Item "BANKMASTER\dist\BANKMASTER-BY-KALOX-2.0.0-Windows-x64-Setup.exe"
          $code = RunSetup $v2.FullName @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/COMPONENTS=vst3,standalone',"/LOG=$pwd\upgrade.log") "$pwd\upgrade.log"
          "2.0 setup exit code: $code" | Tee-Object -FilePath $R -Append
          if ($code -ne 0) { exit 1 }
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{951C821C-D559-4BEF-BC26-6822C33BB554}_is1"
          $u = Get-ItemProperty $key
          $u | Format-List DisplayName,DisplayVersion,Publisher,InstallLocation | Out-String | Tee-Object -FilePath $R -Append
          if ($u.DisplayVersion -ne "2.0.0" -or $u.Publisher -ne "Kalox Audio") { "uninstall entry not upgraded"; exit 1 }
          if (Test-Path (Join-Path $env:ProgramFiles "KALOX")) { "1.0 folder Program Files\KALOX still present"; Get-ChildItem -Recurse (Join-Path $env:ProgramFiles "KALOX"); exit 1 }
          if (Test-Path "HKLM:\SOFTWARE\KALOX\BANKMASTER") { "1.0 registry key still present"; exit 1 }
          if (-not (Test-Path (Join-Path $env:ProgramFiles "Kalox Audio\BANKMASTER\BANKMASTER.exe"))) { "2.0 standalone missing"; exit 1 }
          "1.0 folder and registry key removed, 2.0 installed in Program Files\Kalox Audio\BANKMASTER" | Tee-Object -FilePath $R -Append
          & $HC describe $vst | Tee-Object -FilePath v2_vst3_description.txt | Tee-Object -FilePath $R -Append
          if (-not (Select-String -Path v2_vst3_description.txt -Pattern "manufacturer=Kalox Audio" -Quiet)) { exit 1 }
          $id1 = Select-String -Path v1_vst3_description.txt -Pattern '^(name|uniqueId|deprecatedUid|format)=' | ForEach-Object Line
          $id2 = Select-String -Path v2_vst3_description.txt -Pattern '^(name|uniqueId|deprecatedUid|format)=' | ForEach-Object Line
          if (Compare-Object $id1 $id2) { "plug-in identity changed"; exit 1 }
          "VST3 name / uniqueId / deprecatedUid unchanged 1.0 -> 2.0" | Tee-Object -FilePath $R -Append
          & $HC render $vst nt_v2_vst3_x64 --state-from nt_v1_vst3_x64 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "== V1 x V2 null test: VST3 x64" | Tee-Object -FilePath $R -Append
          & $HC compare nt_v1_vst3_x64 nt_v2_vst3_x64 | Tee-Object -FilePath null_test_vst3_x64.txt | Tee-Object -FilePath $R -Append
          $nullOk = $LASTEXITCODE

          "== uninstall 2.0.0" | Tee-Object -FilePath $R -Append
          $u2code = RunSetup (Join-Path $env:ProgramFiles "Kalox Audio\BANKMASTER\unins000.exe") @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$pwd\uninstall_v2.log") "$pwd\uninstall_v2.log"
          for ($i = 0; $i -lt 60 -and (Test-Path $vst); $i++) { Start-Sleep 1 }
          if ((Test-Path $vst) -or (Test-Path (Join-Path $env:ProgramFiles "Kalox Audio")) -or (Test-Path $key)) { "not clean after uninstall"; exit 1 }
          "system clean after uninstall (exit code $u2code)" | Tee-Object -FilePath $R -Append
          exit $nullOk

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BANKMASTER-BY-KALOX-2.0.0-Windows-x64-Setup
          path: |
            BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-Windows-x64-Setup.exe
            BANKMASTER/dist/BANKMASTER-BY-KALOX-2.0.0-Windows-x64-Setup.exe.sha256

      - name: Upload Windows validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BANKMASTER-Windows-validation-logs
          path: |
            *.txt
            *.log
            snapshots/*.png
            nt_*/*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BANKMASTER-windows-x64-VST3
          path: build/BankMaster_artefacts/Release/VST3/BANKMASTER.vst3
