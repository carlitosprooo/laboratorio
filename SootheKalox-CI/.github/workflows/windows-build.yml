name: Windows build (KaloxSooth)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      JUCE_TAG: 8.0.16-security
      SETUP_EXE: Distribution\Windows\KaloxSooth_1.3.0_Windows_x64_Setup.exe
      HOST_TESTS_EXE: build-win\SootheKaloxHostTests_artefacts\Release\SootheKaloxHostTests.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -products * -format text -property displayName
          & $vswhere -products * -format text -property installationVersion
          cmake --version
          git --version

      - name: Clone JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git ThirdParty/JUCE

      - name: Install Inno Setup 6
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6"
          if (-not (Test-Path "$iscc\ISCC.exe")) { throw "ISCC.exe not found in $iscc" }
          $iscc | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Download pluginval (latest official release)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'pluginval'
          $zip = Join-Path $env:RUNNER_TEMP 'pluginval_Windows.zip'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $exe) { throw 'pluginval.exe not found in pluginval_Windows.zip' }
          Write-Host "pluginval: $($exe.FullName)"
          "PLUGINVAL_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build + tests (DSP/Plugin/GUI/Host) + benchmark + pluginval + package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\windows\build_windows.ps1 -Pluginval "$env:PLUGINVAL_EXE"

      - name: Installer test (install / uninstall / reinstall / upgrade)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Scripts\windows\test_installer.ps1 -Setup $env:SETUP_EXE -HostTests $env:HOST_TESTS_EXE

      - name: Collect reports
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path ci-reports | Out-Null
          $files = @(
            'Documentation\TestReport_Windows.md',
            'Documentation\Benchmarks_Windows.md',
            (Join-Path $env:TEMP 'kaloxsooth_installer_test\InstallerTest.md')
          )
          foreach ($f in $files) {
            if (Test-Path $f) { Copy-Item $f ci-reports\ ; Write-Host "collected: $f" }
            else { Write-Host "missing:   $f" }
          }

      - name: Job summary
        if: always()
        run: |
          $out = $env:GITHUB_STEP_SUMMARY
          "## KaloxSooth 1.3.0 — Windows x64" | Out-File $out -Append -Encoding utf8
          if (Test-Path Distribution\Windows\SHA256SUMS*) {
            '### SHA256SUMS' | Out-File $out -Append -Encoding utf8
            '```' | Out-File $out -Append -Encoding utf8
            Get-Content Distribution\Windows\SHA256SUMS* | Out-File $out -Append -Encoding utf8
            '```' | Out-File $out -Append -Encoding utf8
          }
          Get-ChildItem ci-reports -Filter *.md -ErrorAction SilentlyContinue | ForEach-Object {
            "### $($_.Name)" | Out-File $out -Append -Encoding utf8
            Get-Content $_.FullName | Out-File $out -Append -Encoding utf8
          }

      - name: Upload Windows distribution (Setup.exe, VST3 ZIP, SHA256SUMS)
        uses: actions/upload-artifact@v4
        with:
          name: KaloxSooth_1.3.0_Windows_x64
          path: Distribution/Windows/*
          if-no-files-found: error

      - name: Upload test / benchmark / installer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaloxSooth_Windows_Reports
          path: ci-reports/*
          if-no-files-found: warn
